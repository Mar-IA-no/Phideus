schema_version: 1
updated: 2026-09-04
policy:
  promotion_authority: user
  external_research: experiment_blocking_only
  default_execution: cpu_first
  gpu_coordination: suspended_until_user_reenables

architectures:
  - id: proportional-coherence-graph-core
    name: Núcleo local de coherencia proporcional sobre grafos
    status: candidate
    priority: immediate
    primitive: local two-hop composition of oriented log-ratios modulo global scale
    claim_scope: local path composition only; no learned long-cycle integration
    learned_components:
      - shared edge encoder
      - generic or orientation-typed path mixer
      - corrected-relation and positive-reliability heads
    external_components:
      - weighted least-squares executor
      - frozen Huber or IRLS executor
      - gauge and cycle checker
    evidence_factorial:
      - raw observed operands
      - raw operands plus exact closure residual
    mixer_factorial:
      - generic
      - composition-typed
    learning_tracks:
      - reconstruction supervised without causal-provenance input
      - causal-provenance supervised
    primary_experiment: local graph coherence factorial followed by relation-weight-solver disentanglement
    primary_ood: corruption dependence shift at matched marginal rate
    primary_metrics:
      - pre-solver corrected-relation error per master
      - post-solver quotient RMSE per master and solver
    decisive_controls:
      - unweighted least squares
      - Huber or IRLS
      - exact closure only
      - edge-local MLP
      - pair-state without mixing
      - generic message passing matched in parameters, shapes and initialization but not FLOPs
      - balanced path-incidence shuffle
      - coherent orientation inversion
      - direct centered decoder as diagnostic only
    ood_axes:
      - graph size
      - held-out topology families
      - corruption dependence
    paired_sanities:
      - global latent rescaling
      - node permutation
    artifact_contract:
      - last_epoch checkpoints
      - public schema and constructor hashes
      - master lineage and atomic splits
      - pre-solver and post-solver raw states
      - solver rank condition and failure diagnostics
      - bootstrap indices and replay command
    protocol_audit: PASS after independent REVISE and clean re-audit
    classical_preflight:
      status: executed_and_audited
      masters: 256
      views: 320
      irls_failures: 0
      replay: byte_identical
      observed_result: Huber IRLS improves unweighted WLS in every slice but degrades under grouped corruption relative to IID
      interpretation: validates mechanics, artifact contract, and benchmark difficulty; does not test the neural mixer
    neural_smoke:
      status: executed_audited_and_byte_exactly_reproduced
      trainings: 16
      seeds: 2
      test_masters_paired_iid_grouped: 252
      irls_failures: 8_of_11989_evaluations
      observed_result: typing and path mixing improve relation correction and part of WLS, while direct decoding and robust IRLS do not preserve the advantage
      interpretation: solver-dependent synthetic signal; no physical geometry, architecture promotion or GO/NO-GO
    solver_disentanglement:
      status: executed_audited_and_byte_exactly_reproduced
      source_trainings_reused: 16
      test_masters_paired_iid_grouped: 252
      deterministic_artifacts_replayed: 25_of_25
      wls_observed_result: learned reliability is the largest favorable component; corrected relation adds a smaller gain and their positive interaction cancels part of the total
      irls_observed_result: corrected relation degrades IID while learned reliability degrades grouped; the delivered pair is adverse in every evaluable primary slice
      control_result: the WLS-favorable and IRLS-adverse pattern also appears in non-typed controls, so it is not attributable to the typed mixer alone
      interpretation: corrected relation plus learned reliability is solver-conditioned in this synthetic two-seed slice; no physical geometry, architecture promotion or GO/NO-GO
    solver_interface_diagnostic:
      status: executed_audited_and_byte_exactly_reproduced
      source_trainings_reused: 16
      new_solver_arms: 4_primary
      deterministic_artifacts_replayed: 22_of_22
      static_interface_result: validation selects observed relation with learned weights for WLS and observed relation with unit weights for IRLS; this avoids the delivered IRLS degradation but is a global solver-known rule, not learned routing
      wls_localization_result: eight within-view shuffles preserve each weight multiset but destroy the WLS benefit and become worse than unit weights in every primary IID and grouped slice
      irls_semantics_result: learned base weights leave more final mass on causally altered edges than unit-base IRLS, contradicting double suppression and supporting exogenous-endogenous reweighting interference
      transport_result: scalar temperature and a 23-feature public ridge selector do not provide stable IRLS transport from validation IID to grouped test
      interpretation: one shared reliability output has incompatible executor semantics; solver-typed adapters remain a candidate, without physical geometry, architecture promotion or GO/NO-GO
    frozen_solver_adapters:
      status: executed_and_byte_exactly_reproduced
      trainable_parameters: {wls_weight_head: 4225, irls_relation_head: 4224}
      replay: 31_of_31_deterministic_artifacts
      wls_result: head-only refit improves IID but does not transport to grouped and becomes adverse for typed arms
      irls_result: marginal relation denoising improves relation RMSE but degrades IRLS IID; grouped effects remain uncertain
      interpretation: checkpoint modularity is sufficient, but the proposed head-only objectives are not a transportable executor interface
    irls_surrogate_fidelity:
      status: executed_and_byte_exactly_reproduced
      validation_states_per_depth: 1151
      executor_convergence: 1151_of_1151
      selected_fixed_depth: 64
      replay: 7_of_7_deterministic_artifacts
      value_result: p99 quotient RMSE 2.148e-6 and maximum 3.747e-6 against converged canonical IRLS
      gradient_result: 1197_of_1218 valid coordinates compared away from Huber kinks, median cosine 1.0, p95 relative L2 1.021e-9 and zero stable sign reversals
      interpretation: K64 is numerically conforming as a training surrogate within IID validation; no training, grouped transport, test evidence, architecture promotion or GO/NO-GO
    irls_loss_contrast:
      status: executed_and_byte_exactly_reproduced
      trainable_parameters_per_arm: 4224
      evaluations: 20192
      irls_failures: 0
      replay: 32_of_32_deterministic_artifacts
      relative_result: post-IRLS loss improves over local-relation loss in all eight IID/grouped slices with paired intervals excluding zero
      baseline_result: post-IRLS remains adverse against observed-unit in all IID slices; three grouped slices improve and closure-typed remains uncertain
      interpretation: local denoising is objective-misaligned, but an always-on learned correction is not a universal IRLS interface
    residual_identity_gate:
      status: executed_and_byte_exactly_reproduced
      irls_solves: 25240_of_25240_converged
      replay: 17_of_17_deterministic_artifacts
      grouped_result: public gate improves identity in all four arms and improves sixteen shuffled-target controls on average
      iid_result: three intervals cross zero and raw-typed is adverse; constant and correction-scale gates select identity everywhere
      interpretation: public features carry grouped routing signal, but IID-only validation does not yield a jointly favorable policy
    fresh_mixed_residual_gate:
      status: prospectively_executed_and_byte_exactly_reproduced
      calibration_masters_paired_iid_grouped: 251
      adjudication_masters_paired_iid_grouped: 251
      irls_solves: 40160_of_40160_converged
      replay: 51_of_51_deterministic_artifacts
      grouped_result: mixed public gate improves identity in all four arms on a fresh realization
      iid_result: four intervals cross zero with small adverse point estimates
      balanced_result: raw-generic and raw-typed improve identity; both closure arms remain uncertain
      control_result: mixed gate does not significantly outperform the two-feature correction-scale gate; three grouped arms outperform historical IID calibration and three outperform shuffled controls
      interpretation: mixed calibration reproduces partial public routing and balanced utility in two arms, but not per-mechanism superiority or incremental value of fifteen features over two
    safe_abstention_gate:
      status: prospectively_executed_and_byte_exactly_reproduced
      selection_masters_paired_iid_grouped: 247
      adjudication_masters_paired_iid_grouped: 249
      irls_solves: 39680_of_39680_converged
      replay: 50_of_50_deterministic_artifacts
      selection_result: no nontrivial threshold satisfied the simultaneous IID upper-bound constraint in any full or reduced arm; identity selected in 8/8 gates and 64/64 shuffles
      adjudication_result: safe policies equal identity; unconstrained full gate again improves grouped and balanced in all four arms while IID remains uncertain
      score_diagnostic: predicted advantage correlates positively with realized benefit in grouped and negatively in IID
      interpretation: abstention acts as a conservative firewall but does not resolve routing; power and mechanism-sensitive ordering remain distinct hypotheses
    abstention_power_transport_audit:
      status: posthoc_opened_artifact_audit_byte_exactly_reproduced
      master_counts: 247_selection_251_first_adjudication_249_second_adjudication
      replay: 4_of_4_deterministic_artifacts
      full_fixed_effect_projected_masters: raw_generic_3504_raw_typed_368_closure_generic_613_closure_typed_374
      reduced_result: no finite planning candidate because selection IID means were nonnegative or empirically identity
      transport_result: all four full planning candidates improve grouped and balanced in both opened adjudications, but none keeps IID nonpositive across all three universes and all four are positive in the latest adjudication
      interpretation: simultaneous uncertainty costs power, but a fixed-effect sample enlargement alone does not address the observed IID sign instability
    topology_localization_gate:
      status: prospectively_executed_and_byte_exactly_reproduced
      master_counts: 250_calibration_253_selection_252_adjudication
      irls_solves: 60400_of_60400_converged
      replay: 76_of_76_deterministic_artifacts
      selection_result: identity selected in 12_of_12 main gates and 128_of_128 topology-permuted or target-shuffled controls under simultaneous IID upper bounds
      unconstrained_result: topology improves identity in grouped and balanced in all four arms while IID remains uncertain with nonnegative point estimates
      attribution_result: topology improves public-base and topology-permuted controls in grouped and balanced in all four arms; target-shuffled superiority resolves in three arms
      action_separation: topology acts on 23.4_to_31.7_percent_IID and 62.7_to_68.7_percent_grouped
      interpretation: public topology localization has partial causal routing value within the generator, but mean-regression plus scalar abstention does not yield a safe policy
    conditional_risk_gate:
      status: prospectively_executed_and_byte_exactly_reproduced
      master_counts: 251_risk_fit_249_risk_calibration_250_policy_selection_254_adjudication
      irls_solves: 80320_of_80320_converged
      replay: 98_of_98_deterministic_files
      selection_result: all_12_main_gates_pass_upper_iid_nonpositive_but_many_are_empirical_identity; 60_of_64_permuted_controls_pass
      adjudication_action: topology_13_of_2032_arm_views; both_typed_arms_exact_identity
      adjudication_result: no topology interval against identity excludes zero and no consistent superiority over constant_base_or_permuted_scale
      scale_attribution: topology_absolute_residual_oof_improves_public_base_only_raw_typed_and_permuted_mean_only_two_raw_arms
      interpretation: absolute-residual heteroscedastic risk preserves safety by near-total abstention and does not transport the grouped utility of the frozen topology mean predictor
    signed_tail_diagnostic:
      status: opened_posthoc_design_diagnostic_byte_exactly_reproduced
      source: frozen_R361_four_phase_artifacts
      replay: 11_of_11_deterministic_files
      oof_result: topology_improves_constant_and_permuted_mean_4_of_4_and_public_base_3_of_4
      action_result: deployed_topology_24_of_2032_vs_absolute_scale_13_of_2032
      opened_adjudication_result: raw_generic_grouped_and_balanced_and_closure_generic_balanced_improve_identity; no_interval_improves_permuted_mean
      firewall_result: raw_typed_rejected_and_3_of_4_topology_arms_deployed
      interpretation: signed upper-tail modeling is a better prospective candidate than absolute scale, but opened test reuse prevents policy credit
    signed_tail_gate:
      status: fresh_four_role_adjudication_byte_exactly_reproduced
      source: frozen_R360_topology_mean_predictor
      replay: 102_of_102_deterministic_files
      oof_result: signed_topology_improves_constant_public_base_and_permuted_mean_4_of_4
      action_result: deployed_signed_topology_5_of_2040_vs_absolute_topology_2_of_2040_all_grouped
      adjudication_result: no_signed_interval_against_identity_or_absolute_excludes_zero_and_topology_does_not_beat_permuted_control
      firewall_result: signed_topology_3_of_4_and_absolute_topology_2_of_4_deployed
      interpretation: representation signal survives risk fit but neither simultaneous conformal interface transports useful policy action
    selected_action_calibration_diagnostic:
      status: opened_posthoc_interface_diagnostic_byte_exactly_reproduced
      source: frozen_R363_four_role_predictions_and_bootstraps
      replay: 9_of_9_deterministic_files
      quantile_result: selected_action_q_is_lower_than_simultaneous_q_for_all_families_and_controls
      action_result: topology_increases_from_5_to_14_of_2040
      opened_adjudication_result: closure_typed_improves_identity_grouped_and_balanced_but_no_topology_interval_beats_constant_public_base_or_permuted_control
      interpretation: simultaneous jurisdiction was a real source of abstention but topology-specific policy value remains unresolved
    selected_action_transport_power_audit:
      status: two_opened_cohort_posthoc_audit_byte_exactly_reproduced
      source: frozen_R361_R362_and_R363_R364_artifacts
      replay: 9_of_9_deterministic_files
      firewall_transport: topology_1_of_4_in_cohort_A_vs_4_of_4_in_cohort_B
      action_result: topology_12_of_2032_in_A_and_14_of_2040_in_B
      matched_control_result: 7_of_12_deployed_signs_unstable_2_adverse_both_2_favorable_both_1_identity_or_zero
      power_result: favorable_closure_generic_grouped_and_balanced_require_4993_and_8900_transport_aware_masters
      interpretation: another_approximately_250_master_freeze_is_not_diagnostically_powered_under_the_observed_effect; shared_candidate_space_and_equal_action_budget_are_the_next_bottleneck
    next_action: diagnose a CPU shared-alpha equal-action-budget topology-minus-control ranking interface on opened cohorts before any fresh freeze; keep all GPU work queued
