  - id: joint-set-posterior-policy
    name: Posterior de conjuntos y política contextual
    status: experimental
    priority: physical_extension_paused_incomplete_not_current_geometric_focus
    primitive: set-valued compatibility posterior separated from utility-conditioned action
    learned_components:
      - DeepSets compatibility encoder
      - joint posterior with unary cardinality and interaction potentials
      - nonlinear expected-gain proposer
      - nonlinear damage guard over posterior incompatibility or harm
    external_components:
      - explicit ordinal utility
      - expected-regret decision rule
      - sealed prospective evaluation
    primary_experiment: Wave 59 fresh HGB guard bracket completed and independently audited with exact replay
    wave57_result: separating a Ridge proposer and Logistic harm guard improves accuracy and worst regret over proposer-only but does not satisfy the joint pattern against hard; shuffled control incomplete
    wave58_result: HGB proposer plus HGB posterior-incompatibility guard is nominated for mean regret on the opened draw; HGB plus HGB harm preserves the stronger tail alternative
    wave59_result: on a fresh draw, incompatibility closes 7/8 and harm 6/8; both patterns are false because neither separates maximum-displacement matched controls, and harm also fails compatibility preservation
    observational_degeneracy: 36 canonical IDs reduce to 19 behavioral signatures; nominated JOINT and SEQUENTIAL policies are exact twins and selector identity is unresolved
    mapping_feasibility:
      status: native_set_valued_sheet_passed_common_factorial_failed
      predicates: {common_pass: 1, common_fail: 4, native_pass: 6, native_fail: 0}
      common_failures: [unit_namespace, observation_source, target_schema, decision_stack]
      replay: 148_of_148_core_files
      audit: R544_PASS_0_HIGH_0_MEDIUM_0_LOW
      interpretation: technically_ready_for_a_native_marginal_joint_by_hard_contextual_design_freeze_not_architecture_promotion
    dual_native_freeze:
      status: set_valued_freeze_valid_for_runner_implementation_only
      predicates: {set_pass: 12, set_fail: 0, total_pass: 29, total_fail: 1}
      integrity: {fixtures: 4_of_4, mutations: 61_of_61, replay: byte_exact, audit: R557_PASS_0_HIGH_0_MEDIUM_0_LOW}
      cost_projection_seconds: {low: 120, central: 420, high: 1800}
      interpretation: contract_is_ready_for_cpu_runner_implementation_not_for_fresh_draw_or_empirical_claim
    runner_preflight:
      status: valid_on_opened_historical_data_not_prospective_evidence
      validation: {primary: 14_of_14, replay: 14_of_14, unit_tests: 9_of_9, mutations: 54_of_54, replay_equivalence: byte_exact, audit: R564_PASS_0_HIGH_0_MEDIUM_0_LOW}
      diagnostic: {joint_exact_set_nll: favorable, joint_marginal_brier: not_resolved, contextual_mean_regret: favorable, contextual_incompatibility: favorable, contextual_worst_regret: adverse, matched_controls: not_evaluable_low_common_support}
      interpretation: implementation_and_replay_valid_without_fresh_draw_architecture_promotion_or_GO_NO_GO
    next_action: preserve the opened-data preflight and incomplete physical extension; reuse only when a geometric experiment needs this auxiliary, not as the automatic successor
    limitation: Wave 59 weakens the current bracket under one fresh synthetic realization but does not establish a ceiling for proposer/guard architectures, validate proportional geometry, promote an architecture or decide GO/NO-GO
