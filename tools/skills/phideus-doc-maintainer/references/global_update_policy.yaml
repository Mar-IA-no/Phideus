version: 1
defaults:
  collab_mode: off
  legacy_excluded_by_default: true
  forbidden_paths:
    - PENDIENTES.md
    - CLAUDE.md
  collab_root: COLLAB
  legacy_roots:
    - Documents/Legacy
    - Documents/UOEMD
  tier_a_docs:
    - README.md
    - Documents/INDICE_DOCUMENTACION.md
    - Documents/Proyecto_Estado_Actual.md
    - Documents/BIAS_CONTROL/ROADMAP_BIAS_CONTROL.md

event_types:
  gate_result_update:
    front_levels: [primary, secondary]
    default_true_flags: [experimental_advance]
    global_rules:
      - doc: Documents/bitacora_desarrollo.md
        require_any: [experimental_advance, technical_decision]
      - doc: Documents/Proyecto_Estado_Actual.md
        require_any: [status_changed, focus_changed, technical_decision]
      - doc: README.md
        require_any: [trunk_milestone, focus_changed]

  roadmap_or_strategy_update:
    front_levels: [primary, secondary]
    default_true_flags: [technical_decision]
    global_rules:
      - doc: Documents/Proyecto_Estado_Actual.md
        require_any: [status_changed, focus_changed, technical_decision]
      - doc: Documents/bitacora_desarrollo.md
        require_any: [technical_decision]
      - doc: Documents/INDICE_DOCUMENTACION.md
        require_any: [doc_structure_changed]
      - doc: README.md
        require_any: [trunk_milestone, focus_changed]

  protocol_or_policy_update:
    front_levels: [primary]
    default_true_flags: [technical_decision]
    global_rules:
      - doc: CODEX.md
        require_any: [technical_decision]
      - doc: Documents/bitacora_desarrollo.md
        require_any: [technical_decision]
      - doc: Documents/Proyecto_Estado_Actual.md
        require_any: [status_changed, focus_changed]

  new_doc_or_major_reorg:
    front_levels: [primary, secondary]
    default_true_flags: [doc_structure_changed]
    global_rules:
      - doc: Documents/INDICE_DOCUMENTACION.md
        require_any: [doc_structure_changed]
      - doc: Documents/Proyecto_Estado_Actual.md
        require_any: [status_changed, focus_changed, doc_structure_changed]
      - doc: Documents/bitacora_desarrollo.md
        require_any: [technical_decision, doc_structure_changed]
      - doc: README.md
        require_any: [trunk_milestone, focus_changed]

  status_snapshot_update:
    front_levels: [primary]
    default_true_flags: [status_changed]
    global_rules:
      - doc: Documents/Proyecto_Estado_Actual.md
        require_any: [status_changed, focus_changed, technical_decision]
      - doc: Documents/bitacora_desarrollo.md
        require_any: [experimental_advance, technical_decision]
      - doc: README.md
        require_any: [trunk_milestone, focus_changed]
